<!DOCTYPE html>
<html lang="zh-Hant" data-theme="classic">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>房屋貸款試算</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  /* ===== 主題色票 ===== */
  :root, [data-theme="classic"]{
    --paper:#F6F7F4; --panel:#FFFFFF; --ink:#1E2B38; --ink-2:#5B6873; --line:#D9DED8; --line-soft:#EEF0EC;
    --accent:#1E6B5B; --accent-hover:#185848; --accent-soft:#E3EFEA; --on-accent:#fff;
    --warn:#B8781A; --warn-soft:#FBF1DF; --danger:#B4433A; --danger-soft:#FBE9E7;
    --thead:#F1F3EF; --input:#fff; --radius:10px; --radius-sm:8px; --shadow:none;
    --font:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
    --font-display:var(--font); --font-num:var(--font); --bg-decor:none;
  }
  [data-theme="tech"]{
    --paper:#0B1220; --panel:#111A2C; --ink:#E6EDF7; --ink-2:#8DA2BF; --line:#243350; --line-soft:#1B2740;
    --accent:#22D3EE; --accent-hover:#06B6D4; --accent-soft:rgba(34,211,238,.13); --on-accent:#06202A;
    --warn:#F5B942; --warn-soft:rgba(245,185,66,.14); --danger:#FB7185; --danger-soft:rgba(251,113,133,.14);
    --thead:#0E1729; --input:#0C1424; --radius:6px; --radius-sm:4px; --shadow:0 0 0 1px rgba(34,211,238,.06),0 12px 40px rgba(0,0,0,.45);
    --font:"Noto Sans TC",system-ui,sans-serif; --font-display:"JetBrains Mono","Noto Sans TC",monospace; --font-num:"JetBrains Mono",monospace;
    --bg-decor:linear-gradient(rgba(34,211,238,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.05) 1px,transparent 1px);
  }
  [data-theme="warm"]{
    --paper:#FBF3E9; --panel:#FFFCF7; --ink:#3B2E27; --ink-2:#8A7568; --line:#E9D8C6; --line-soft:#F3E8DA;
    --accent:#B85A34; --accent-hover:#9E4A28; --accent-soft:#F9E5D8; --on-accent:#fff;
    --warn:#C08A22; --warn-soft:#FBEED5; --danger:#B0463C; --danger-soft:#F9E3DF;
    --thead:#F7EBDD; --input:#FFFDFA; --radius:20px; --radius-sm:12px; --shadow:0 10px 30px rgba(120,80,50,.10);
    --font:"Noto Sans TC",system-ui,sans-serif; --font-display:"Noto Serif TC",serif; --font-num:var(--font);
    --bg-decor:radial-gradient(circle at 12% 0%,#FCE1CC 0,transparent 42%),radial-gradient(circle at 100% 100%,#F8E9D2 0,transparent 40%);
  }

  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;font-variant-numeric:tabular-nums}
  body{background-image:var(--bg-decor);background-attachment:fixed;background-size:32px 32px,32px 32px}
  [data-theme="warm"] body{background-size:auto}
  body,.form,.summary,.table-wrap,button,input,select{transition:background-color .25s,color .25s,border-color .25s}

  header{padding:36px 28px 18px;max-width:1180px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
  header h1{font-family:var(--font-display);font-size:28px;font-weight:700;margin:0 0 4px;letter-spacing:.02em}
  [data-theme="tech"] header h1{letter-spacing:.04em}
  [data-theme="tech"] header h1::before{content:"//";color:var(--accent);margin-right:10px;font-weight:400}
  header p{margin:0;color:var(--ink-2)}
  .themes{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px}
  .themes button{border:0;background:transparent;color:var(--ink-2);font:inherit;font-size:13.5px;height:32px;padding:0 14px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .themes button i{width:10px;height:10px;border-radius:50%;display:inline-block}
  .themes button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:500}
  .themes button[aria-pressed="true"] i{background:var(--on-accent)!important}

  main{max-width:1180px;margin:0 auto;padding:0 28px 60px;display:grid;grid-template-columns:380px 1fr;gap:28px;align-items:start}
  @media (max-width:900px){main{grid-template-columns:1fr}header{padding:28px 18px 12px}main{padding:0 18px 40px}}

  /* ===== 表單 ===== */
  .form{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px;position:sticky;top:18px;box-shadow:var(--shadow)}
  @media (max-width:900px){.form{position:static}}
  fieldset{border:0;padding:0;margin:0 0 18px}
  legend{font-weight:500;padding:0;margin-bottom:8px;display:block}
  [data-theme="tech"] legend{color:var(--accent);font-family:var(--font-display);font-size:13.5px}
  [data-theme="warm"] legend{font-family:var(--font-display);font-size:16px}
  label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:6px}
  .row{display:flex;gap:10px}
  .row>*{flex:1;min-width:0}
  .field{position:relative}
  .field input,.field select{width:100%;height:42px;border:1px solid var(--line);border-radius:var(--radius-sm);padding:0 12px;font:inherit;font-family:var(--font-num);color:var(--ink);background:var(--input)}
  .field input:disabled{color:var(--ink-2);background:var(--line-soft)}
  .field input:focus,.field select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  .field .unit{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--ink-2);font-size:13px;pointer-events:none}
  .field.u input{padding-right:36px}
  .seg{display:flex;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--input)}
  .seg button{flex:1;height:40px;border:0;background:transparent;font:inherit;color:var(--ink-2);cursor:pointer}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:500}
  .stage{display:grid;grid-template-columns:1fr auto 1fr auto auto 1fr auto;gap:8px;align-items:center;margin-top:10px}
  .stage .sep,.stage .lbl{color:var(--ink-2);font-size:13.5px;white-space:nowrap}
  .stage .lbl{margin-left:4px}
  .stage .field input{padding:0 10px;text-align:center}
  .stage .field input:disabled{text-align:center}
  .hint{font-size:12.5px;color:var(--ink-2);margin:6px 0 0}
  .primary{width:100%;height:46px;border:0;border-radius:var(--radius-sm);background:var(--accent);color:var(--on-accent);font:inherit;font-size:16px;font-weight:500;cursor:pointer;margin-top:4px}
  .primary:hover{background:var(--accent-hover)}
  [data-theme="tech"] .primary{box-shadow:0 0 18px rgba(34,211,238,.35);font-family:var(--font-display);letter-spacing:.06em}
  [data-theme="warm"] .primary{border-radius:999px;box-shadow:0 6px 16px rgba(184,90,52,.28)}
  .err{display:none;margin-top:12px;padding:10px 12px;border-radius:var(--radius-sm);background:var(--danger-soft);color:var(--danger);font-size:13.5px}
  .err.on{display:block}

  /* ===== 結果 ===== */
  .results{display:grid;gap:22px}
  .empty{border:1px dashed var(--line);border-radius:var(--radius);padding:48px 24px;text-align:center;color:var(--ink-2)}
  .summary{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  [data-theme="tech"] .summary::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--accent),transparent)}
  .summary h2{font-size:15px;font-weight:500;color:var(--ink-2);margin:0 0 14px}
  .schedule{margin:0;padding:0;list-style:none}
  .schedule li{display:flex;justify-content:space-between;align-items:baseline;padding:11px 0;border-top:1px solid var(--line);gap:12px;flex-wrap:wrap}
  .schedule li:first-child{border-top:0;padding-top:0}
  .schedule .range{color:var(--ink-2)}
  .schedule .amt{font-family:var(--font-num);font-size:23px;font-weight:700;letter-spacing:.01em}
  [data-theme="warm"] .schedule .amt{font-family:var(--font-display)}
  [data-theme="tech"] .schedule .amt{color:var(--accent)}
  .schedule .amt small{font-size:14px;font-weight:400;color:var(--ink-2);margin-left:2px;font-family:var(--font)}
  .schedule .grace{font-size:12px;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:2px 10px;margin-left:8px;vertical-align:middle;font-family:var(--font)}
  .p-detail{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--font-num);font-weight:700;font-size:17px}
  .p-detail small{display:block;font-size:12px;font-weight:400;color:var(--ink-2);font-family:var(--font)}
  .p-detail em{font-style:normal;font-size:13px;font-weight:400;color:var(--ink-2);margin-left:2px;font-family:var(--font)}
  .p-detail .amt-sm{font-size:21px}
  [data-theme="tech"] .p-detail .amt-sm{color:var(--accent)}
  .totals{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px;padding-top:18px;border-top:2px solid var(--ink)}
  [data-theme="tech"] .totals{border-top-color:var(--line)}
  @media (max-width:560px){.totals{grid-template-columns:1fr}}
  .totals div span{display:block;font-size:13px;color:var(--ink-2)}
  .totals div strong{font-size:20px;font-weight:700;font-family:var(--font-num)}
  .totals .interest strong{color:var(--danger)}

  .table-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
  .table-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);gap:12px;flex-wrap:wrap}
  .table-head h2{font-size:15px;font-weight:500;margin:0}
  .dl{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border:1px solid var(--accent);border-radius:var(--radius-sm);background:var(--accent-soft);color:var(--accent);font:inherit;font-weight:500;cursor:pointer}
  .dl:hover{background:var(--accent);color:var(--on-accent)}
  [data-theme="warm"] .dl{border-radius:999px}
  .dl svg{width:18px;height:18px}
  .scroll{max-height:560px;overflow:auto}
  table{width:100%;border-collapse:collapse;font-size:14px;font-family:var(--font-num)}
  th,td{padding:9px 14px;text-align:right;white-space:nowrap}
  th{position:sticky;top:0;background:var(--thead);color:var(--ink-2);font-weight:500;border-bottom:1px solid var(--line);z-index:1;font-family:var(--font)}
  td{border-bottom:1px solid var(--line-soft)}
  th:first-child,td:first-child{text-align:left}
  tr.g td{background:var(--warn-soft)}
  tr.rate-change td{border-top:2px solid var(--accent)}
  .ym{color:var(--ink-2);font-size:12.5px;margin-left:6px;font-family:var(--font)}
  @media (prefers-reduced-motion:no-preference){.summary,.table-wrap{animation:in .25s ease-out}}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<header>
  <div>
    <h1>房屋貸款試算</h1>
    <p>填入貸款條件，計算每期應繳金額與完整攤還表，可下載 Excel。</p>
  </div>
  <div class="themes" id="themes" role="group" aria-label="版型">
    <button type="button" data-v="classic" aria-pressed="true"><i style="background:#1E6B5B"></i>經典</button>
    <button type="button" data-v="tech" aria-pressed="false"><i style="background:#22D3EE"></i>科技</button>
    <button type="button" data-v="warm" aria-pressed="false"><i style="background:#B85A34"></i>溫暖</button>
  </div>
</header>

<main>
  <form class="form" id="form" novalidate>
    <fieldset>
      <legend>貸款條件</legend>
      <label for="amount">貸款金額</label>
      <div class="field u"><input id="amount" type="text" inputmode="numeric" value="8,000,000"><span class="unit">元</span></div>

      <label for="start" style="margin-top:12px">開始日期（撥款日）</label>
      <div class="field"><input id="start" type="date"></div>
      <p class="hint">第 1 期應繳日為開始日期的次月同日，之後每月一期。</p>

      <label style="margin-top:12px">貸款年限</label>
      <div class="row">
        <div class="field u"><input id="ty" type="number" min="0" max="99" step="1" value="20"><span class="unit">年</span></div>
        <div class="field u"><input id="tm" type="number" min="0" max="12" step="1" value="0"><span class="unit">月</span></div>
      </div>

      <label style="margin-top:12px">寬限期（僅繳利息）</label>
      <div class="row">
        <div class="field u"><input id="gy" type="number" min="0" max="9" step="1" value="3"><span class="unit">年</span></div>
        <div class="field u"><input id="gm" type="number" min="0" max="12" step="1" value="0"><span class="unit">月</span></div>
      </div>
    </fieldset>

    <fieldset>
      <legend>還款方式</legend>
      <div class="seg" id="method">
        <button type="button" data-v="pi" aria-pressed="true">本息平均攤還</button>
        <button type="button" data-v="p" aria-pressed="false">本金平均攤還</button>
      </div>
      <p class="hint" id="methodHint">每月繳款金額固定，前期利息占比較高。</p>
    </fieldset>

    <fieldset>
      <legend>利率</legend>
      <div class="seg" id="stages">
        <button type="button" data-v="1" aria-pressed="false">一段式</button>
        <button type="button" data-v="2" aria-pressed="false">二段式</button>
        <button type="button" data-v="3" aria-pressed="true">三段式</button>
      </div>
      <div id="stageBox"></div>
    </fieldset>

    <button type="submit" class="primary">開始試算</button>
    <div class="err" id="err"></div>
  </form>

  <section class="results" id="results">
    <div class="empty">按「開始試算」後，這裡會顯示每期繳款金額與攤還明細。</div>
  </section>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const fmt = n => Math.round(n).toLocaleString('zh-TW');
  let method = 'pi', stageCount = 3, lastResult = null;

  // ---------- 版型切換 ----------
  const root = document.documentElement;
  function setTheme(v) {
    root.setAttribute('data-theme', v);
    [...$('themes').children].forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v));
    try { localStorage.setItem('mortgage-theme', v); } catch (e) {}
  }
  try { const t = localStorage.getItem('mortgage-theme'); if (t) setTheme(t); } catch (e) {}
  $('themes').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setTheme(b.dataset.v); });

  // ---------- 利率段輸入：起月 ~ 迄月 月 利率: x % ----------
  // 每段起月 = 前一段迄月 + 1（自動），最後一段迄月 = 總期數（自動）
  const defaults = [[12, 1.85], [24, 2.11], [null, 2.56]];
  const totalMonthsNow = () => (+$('ty').value || 0) * 12 + (+$('tm').value || 0);
  function renderStages() {
    const box = $('stageBox');
    const saved = readStagesRaw();
    box.innerHTML = '';
    for (let i = 0; i < stageCount; i++) {
      const last = i === stageCount - 1;
      const e = saved[i]?.end ?? defaults[i][0];
      const r = saved[i]?.rate ?? defaults[i][1];
      const div = document.createElement('div');
      div.className = 'stage';
      div.innerHTML = `
        <div class="field"><input type="text" class="s-s" disabled aria-label="第 ${i + 1} 段起月"></div>
        <span class="sep">~</span>
        <div class="field"><input type="number" class="s-e" min="1" step="1" value="${last ? '' : e}" ${last ? 'disabled' : ''} aria-label="第 ${i + 1} 段迄月"></div>
        <span class="lbl">月</span>
        <span class="lbl">利率:</span>
        <div class="field"><input type="number" class="s-r" step="0.001" min="0" max="15.999" value="${r}" aria-label="第 ${i + 1} 段年利率"></div>
        <span class="lbl">%</span>`;
      box.appendChild(div);
    }
    syncStages();
  }
  // 依迄月重算各段起月與最後一段迄月
  function syncStages() {
    const rows = [...document.querySelectorAll('#stageBox .stage')];
    let start = 1;
    rows.forEach((row, i) => {
      row.querySelector('.s-s').value = start;
      const endEl = row.querySelector('.s-e');
      if (i === rows.length - 1) endEl.value = totalMonthsNow() || '';
      const end = +endEl.value;
      start = (end > 0 ? end : start) + 1;
    });
  }
  function readStagesRaw() {
    return [...document.querySelectorAll('#stageBox .stage')].map(s => ({
      end: s.querySelector('.s-e').disabled ? null : (s.querySelector('.s-e').value === '' ? null : +s.querySelector('.s-e').value),
      rate: +s.querySelector('.s-r').value
    }));
  }
  $('stageBox').addEventListener('input', e => { if (e.target.classList.contains('s-e')) syncStages(); });
  ['ty', 'tm'].forEach(id => $(id).addEventListener('input', syncStages));

  function seg(id, onChange) {
    $(id).addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      [...$(id).children].forEach(x => x.setAttribute('aria-pressed', x === b));
      onChange(b.dataset.v);
    });
  }
  seg('method', v => {
    method = v;
    $('methodHint').textContent = v === 'pi'
      ? '每月繳款金額固定，前期利息占比較高。'
      : '每月償還相同本金，繳款金額逐期遞減。';
  });
  seg('stages', v => { stageCount = +v; renderStages(); });
  renderStages();

  // 預設開始日期為今天
  const today = new Date();
  $('start').value = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
  const addMonths = (d, n) => {
    const y = d.getFullYear(), mo = d.getMonth() + n, day = d.getDate();
    const last = new Date(y, mo + 1, 0).getDate();
    return new Date(y, mo, Math.min(day, last));
  };
  const fmtDate = d => `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;
  const isInt = v => v !== '' && Number.isInteger(+v);

  $('amount').addEventListener('blur', e => {
    const n = parseInt(e.target.value.replace(/[^\d]/g, ''), 10);
    e.target.value = isNaN(n) ? '' : n.toLocaleString('zh-TW');
  });

  // ---------- 試算（月付金／每期本金無條件進位至元，利息四捨五入至元） ----------
  const ceil = x => Math.ceil(x - 1e-9);
  function calculate(p) {
    const { amount, totalMonths: N, graceMonths: G, stages } = p;
    const rateAt = m => {
      let acc = 0;
      for (const s of stages) {
        if (s.months == null) return s.rate;
        acc += s.months;
        if (m <= acc) return s.rate;
      }
      return stages[stages.length - 1].rate;
    };
    const rows = [];
    let bal = amount, pmt = 0, fixedPrincipal = 0, prevRate = null;
    let totalPay = 0, totalInt = 0;
    for (let m = 1; m <= N; m++) {
      const rate = rateAt(m), r = rate / 100 / 12;
      const rateChanged = prevRate !== null && rate !== prevRate;
      const interest = Math.round(bal * r); // 利息四捨五入至元
      let principal = 0;
      const inGrace = m <= G;
      if (!inGrace) {
        const rem = N - m + 1;
        if (p.method === 'pi') {
          if (m === G + 1 || rateChanged) {
            pmt = r === 0 ? bal / rem : bal * r * Math.pow(1 + r, rem) / (Math.pow(1 + r, rem) - 1);
            pmt = ceil(pmt);
          }
          principal = pmt - interest;
        } else {
          if (m === G + 1) fixedPrincipal = ceil(bal / rem);
          principal = fixedPrincipal;
        }
        if (m === N || principal > bal) principal = bal;
      }
      const payment = principal + interest;
      bal -= principal;
      totalPay += payment; totalInt += interest;
      rows.push({ m, rate, inGrace, rateChanged, principal, interest, payment, balance: bal, due: fmtDate(addMonths(p.startDate, m)) });
      prevRate = rate;
    }
    // 本息平均：以相同月付金合併；本金平均：以寬限期／利率段切分，顯示各期間首期利息與固定本金
    const groups = [];
    for (const row of rows) {
      const g = groups[groups.length - 1];
      const same = p.method === 'pi'
        ? g && g.payment === row.payment && g.inGrace === row.inGrace
        : g && g.inGrace === row.inGrace && !row.rateChanged;
      if (same) g.end = row.m;
      else groups.push({ start: row.m, end: row.m, payment: row.payment, inGrace: row.inGrace,
                         principal: row.principal, firstInterest: row.interest, rate: row.rate });
    }
    return { rows, groups, totalPay, totalInt, amount, params: p };
  }

  function readForm() {
    const amount = parseInt($('amount').value.replace(/[^\d]/g, ''), 10);
    const ty = $('ty').value, tm = $('tm').value, gy = $('gy').value, gm = $('gm').value;
    const totalMonths = (+ty || 0) * 12 + (+tm || 0);
    const graceMonths = (+gy || 0) * 12 + (+gm || 0);
    const raw = readStagesRaw();
    const errs = [];
    if (!amount || amount <= 0) errs.push('請輸入貸款金額。');
    const startDate = $('start').value ? new Date($('start').value + 'T00:00:00') : null;
    if (!startDate || isNaN(startDate)) errs.push('請選擇開始日期。');
    if (!isInt(ty) || !isInt(tm)) errs.push('貸款年限的年與月只能輸入整數。');
    else {
      if (+ty < 0 || +ty > 99) errs.push('貸款年限的年不可大於 99 年。');
      if (+tm < 0 || +tm > 12) errs.push('貸款年限的月不可大於 12 月。');
      if (totalMonths <= 0) errs.push('貸款年限必須大於 0。');
    }
    if (!isInt(gy) || !isInt(gm)) errs.push('寬限期的年與月只能輸入整數。');
    else {
      if (+gy < 0 || +gy > 9) errs.push('寬限期的年不可大於 9 年。');
      if (+gm < 0 || +gm > 12) errs.push('寬限期的月不可大於 12 月。');
      if (graceMonths >= totalMonths) errs.push('寬限期必須短於貸款年限。');
    }
    // 由各段迄月換算每段月數；最後一段至期滿
    const stages = [];
    let prevEnd = 0;
    raw.forEach((s, i) => {
      const last = i === raw.length - 1;
      if (isNaN(s.rate) || s.rate < 0) errs.push(`第 ${i + 1} 段年利率不正確。`);
      else if (s.rate >= 16) errs.push(`第 ${i + 1} 段年利率必須小於 16%。`);
      if (last) { stages.push({ months: null, rate: s.rate }); return; }
      if (s.end == null || !Number.isInteger(s.end)) errs.push(`第 ${i + 1} 段迄月只能輸入整數。`);
      else if (s.end <= prevEnd) errs.push(`第 ${i + 1} 段迄月必須大於 ${prevEnd} 月。`);
      else if (s.end >= totalMonths) errs.push(`第 ${i + 1} 段迄月必須小於總期數 ${totalMonths} 月。`);
      stages.push({ months: s.end - prevEnd, rate: s.rate });
      prevEnd = s.end > prevEnd ? s.end : prevEnd;
    });
    return { params: { amount, totalMonths, graceMonths, stages, method, startDate }, errs };
  }

  $('form').addEventListener('submit', e => {
    e.preventDefault();
    const { params, errs } = readForm();
    const errBox = $('err');
    if (errs.length) { errBox.textContent = errs.join(' '); errBox.classList.add('on'); return; }
    errBox.classList.remove('on');
    lastResult = calculate(params);
    render(lastResult);
    if (window.innerWidth <= 900) $('results').scrollIntoView({ behavior: 'smooth' });
  });

  // ---------- 呈現 ----------
  const ym = m => { const y = Math.ceil(m / 12), mm = ((m - 1) % 12) + 1; return `第${y}年第${mm}月`; };

  function render(res) {
    const { rows, groups, totalPay, totalInt, amount, params } = res;
    const methodName = params.method === 'pi' ? '本息平均攤還' : '本金平均攤還';
    const rangeLabel = g => `第 ${g.start}${g.end !== g.start ? ` - ${g.end}` : ''} 月${g.inGrace ? '<span class="grace">寬限期</span>' : ''}`;
    const groupHtml = params.method === 'pi'
      ? groups.map(g => `
        <li>
          <span class="range">${rangeLabel(g)}</span>
          <span class="amt">$ ${fmt(g.payment)}<small>元</small></span>
        </li>`).join('')
      : groups.map(g => `
        <li class="p-row">
          <span class="range">${rangeLabel(g)}<span class="ym">年利率 ${g.rate.toFixed(3)}%</span></span>
          <span class="p-detail">
            ${g.inGrace
              ? `<span><small>首期利息</small>$ ${fmt(g.firstInterest)}<em>元</em></span>`
              : `<span><small>每期本金</small>$ ${fmt(g.principal)}<em>元</em></span>
                 <span><small>首期利息</small>$ ${fmt(g.firstInterest)}<em>元</em></span>
                 <span class="amt-sm"><small>首期應繳</small>$ ${fmt(g.payment)}<em>元</em></span>`}
          </span>
        </li>`).join('');

    const tableRows = rows.map(r => `
      <tr class="${r.inGrace ? 'g' : ''} ${r.rateChanged ? 'rate-change' : ''}">
        <td>${r.m}<span class="ym">${ym(r.m)}</span></td>
        <td>${r.due}</td>
        <td>${r.rate.toFixed(3)}%</td>
        <td>${fmt(r.principal)}</td>
        <td>${fmt(r.interest)}</td>
        <td><b>${fmt(r.payment)}</b></td>
        <td>${fmt(r.balance)}</td>
      </tr>`).join('');

    $('results').innerHTML = `
      <div class="summary">
        <h2>${params.method === 'pi' ? '還款月付金' : '各期間首期應繳（本金固定，利息逐期遞減）'} ・ ${methodName} ・ 共 ${params.totalMonths} 期 ・ 開始日期 ${fmtDate(params.startDate)}</h2>
        <ul class="schedule">${groupHtml}</ul>
        <div class="totals">
          <div><span>貸款金額</span><strong>$ ${fmt(amount)} 元</strong></div>
          <div class="interest"><span>支付利息</span><strong>$ ${fmt(totalInt)} 元</strong></div>
          <div><span>還款總額</span><strong>$ ${fmt(totalPay)} 元</strong></div>
        </div>
      </div>
      <div class="table-wrap">
        <div class="table-head">
          <h2>每期攤還明細</h2>
          <button type="button" class="dl" id="dl" title="下載 Excel">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
            下載 Excel
          </button>
        </div>
        <div class="scroll">
          <table>
            <thead><tr><th>期數</th><th>應繳日期</th><th>年利率</th><th>償還本金</th><th>支付利息</th><th>本息合計</th><th>剩餘本金</th></tr></thead>
            <tbody>${tableRows}</tbody>
          </table>
        </div>
      </div>`;
    $('dl').addEventListener('click', () => downloadExcel(res));
  }

  // ---------- Excel ----------
  function downloadExcel(res) {
    const { rows, groups, totalPay, totalInt, amount, params } = res;
    const methodName = params.method === 'pi' ? '本息平均攤還' : '本金平均攤還';
    const wb = XLSX.utils.book_new();

    const summary = [
      ['房屋貸款試算'],
      [],
      ['貸款金額', amount],
      ['開始日期', fmtDate(params.startDate)],
      ['貸款年限', `${Math.floor(params.totalMonths / 12)} 年 ${params.totalMonths % 12} 月（共 ${params.totalMonths} 期）`],
      ['寬限期', `${Math.floor(params.graceMonths / 12)} 年 ${params.graceMonths % 12} 月`],
      ['還款方式', methodName],
      ['利率', `${params.stages.length} 段式`],
      ...(() => { let st = 1; return params.stages.map((s, i) => {
        const end = s.months != null ? st + s.months - 1 : params.totalMonths;
        const row = [`第 ${i + 1} 段年利率`, `第 ${st} ~ ${end} 月：${s.rate}%`]; st = end + 1; return row; }); })(),
      [],
      ...(params.method === 'pi'
        ? [['還款月付金'],
           ...groups.map(g => [`第 ${g.start}${g.end !== g.start ? ` - ${g.end}` : ''} 月${g.inGrace ? '（寬限期）' : ''}`, g.payment])]
        : [['各期間', '每期本金', '首期利息', '首期應繳'],
           ...groups.map(g => [`第 ${g.start}${g.end !== g.start ? ` - ${g.end}` : ''} 月${g.inGrace ? '（寬限期）' : ''}`, g.principal, g.firstInterest, g.payment])]),
      [],
      ['還款總額', totalPay],
      ['貸款金額', amount],
      ['支付利息', totalInt],
    ];
    const ws1 = XLSX.utils.aoa_to_sheet(summary);
    ws1['!cols'] = [{ wch: 22 }, { wch: 28 }, { wch: 14 }, { wch: 14 }];
    XLSX.utils.book_append_sheet(wb, ws1, '試算摘要');

    const detail = [['期數', '應繳日期', '年利率(%)', '償還本金', '支付利息', '本息合計', '剩餘本金', '備註'],
      ...rows.map(r => [r.m, r.due, r.rate, r.principal, r.interest, r.payment, r.balance, r.inGrace ? '寬限期' : ''])];
    const ws2 = XLSX.utils.aoa_to_sheet(detail);
    ws2['!cols'] = [8, 14, 10, 14, 14, 14, 16, 10].map(w => ({ wch: w }));
    const range = XLSX.utils.decode_range(ws2['!ref']);
    for (let R = 1; R <= range.e.r; R++) for (const C of [3, 4, 5, 6]) {
      const cell = ws2[XLSX.utils.encode_cell({ r: R, c: C })];
      if (cell) cell.z = '#,##0';
    }
    XLSX.utils.book_append_sheet(wb, ws2, '每期攤還明細');

    XLSX.writeFile(wb, `房貸試算_${fmt(amount).replace(/,/g, '')}_${params.totalMonths}期.xlsx`);
  }
})();
</script>
</body>
</html>
